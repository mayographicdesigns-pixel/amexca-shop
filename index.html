<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMEXCA Obsidian Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <header>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="products">
            <h1>Welcome to AMEXCA Obsidian Shop</h1>
            <div class="product-grid">
                <div class="product-item">
                    <img src="product1.jpg" alt="Product 1">
                    <h2>Product 1</h2>
                    <p>$19.99</p>
                </div>
                <div class="product-item">
                    <img src="product2.jpg" alt="Product 2">
                    <h2>Product 2</h2>
                    <p>$29.99</p>
                </div>
                <!-- Add more products as needed -->
            </div>
            <div class="mockup-container">
                <img src="mockup.jpg" alt="Interactive Mockup">
            </div>
        </section>
    </main>

    <div class="ticker">
        <marquee>Welcome to our shop! Check out our latest products!</marquee>
    </div>

    <footer>
        <p>&copy; 2026 AMEXCA Obsidian Shop</p>
    </footer>
</body>
</html>
